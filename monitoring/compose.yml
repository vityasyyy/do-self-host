services:
  # 1. Prometheus (The Database)
  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN}`)"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      # - "traefik.http.routers.prometheus.middlewares=dokploy-auth-basic" # Optional: Protects with Dokploy password

  # 2. Grafana (The Dashboard)
  grafana:
    image: grafana/grafana:latest
    container_name: monitoring-grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/alerting:/etc/grafana/provisioning/alerting
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # 3. Noode Exporter (Server Metrics - CPU, RAM, Disk)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: monitoring-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    networks:
      - dokploy-network

  # 4. cAdvisor (Docker Container Metrics)
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.53.0
    container_name: monitoring-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    networks:
      - dokploy-network

  # # 5. Dozzle (Lightweight Logs Viewer)
  # dozzle:
  #   image: amir20/dozzle:latest
  #   container_name: monitoring-dozzle
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   environment:
  #     DOZZLE_LEVEL: info
  #   networks:
  #     - dokploy-network
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.dozzle.rule=Host(`logs.${DOMAIN}`)"
  #     - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
  #     # HIGHLY RECOMMENDED: Protect logs with a password since they show sensitive info
  #     # - "traefik.http.routers.dozzle.middlewares=dokploy-auth-basic"
  #
  # trigger
  loki:
    image: grafana/loki:latest
    container_name: monitoring-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - dokploy-network
    volumes:
      - loki_data:/loki
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml

  # 6. Promtail (The Log Shipper)
  promtail:
    image: grafana/promtail:latest
    container_name: monitoring-promtail
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro # Read container logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml # You need to create this file
      - promtail_data:/etc/promtail
    command: -config.file=/etc/promtail/config.yml
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data:
