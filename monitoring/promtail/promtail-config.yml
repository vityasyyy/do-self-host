server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: status
            values: [running]
    relabel_configs:
      # 1. Get the container name (e.g., "monitoring-prometheus")
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      # 2. Get the stream (stdout vs stderr)
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"

    pipeline_stages:
      # 3. Unwrap the Docker JSON wrapper
      - json:
          expressions:
            log: log
            stream: stream
            time: time
      # 4. Use the timestamp from the log line (not the time Promtail read it)
      - timestamp:
          source: time
          format: RFC3339Nano
      # 5. Extract "level" (Info/Error) from the actual message text
      - regex:
          expression: "(?i)(?P<level>trace|debug|info|warn|warning|error|fatal|panic)"
          source: log
      # 6. Turn that extracted "level" into a clickable label in Grafana
      - labels:
          level:
