server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml # Remembers where it left off reading logs

clients:
  - url: http://loki:3100/loki/api/v1/push # Sends logs to the 'loki' container

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker_logs
          __path__: /var/lib/docker/containers/*/*-json.log # The standard Docker log path
