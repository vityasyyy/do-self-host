apiVersion: 1

# 1. Define where to send notifications
contactPoints:
  - orgId: 1
    name: Discord-Channel
    receivers:
      - uid: discord-receiver
        type: discord
        settings:
          url: "${DISCORD_WEBHOOK_URL}"
          message: |
            {{ template "default.message" . }}

# 2. Define the policy (Send everything to Discord)
policies:
  - orgId: 1
    name: Default-Policy
    receiver: Discord-Channel
    group_by: ["alertname", "container"]

# 3. Define the Alert Rules
groups:
  - orgId: 1
    name: Docker-Alerts
    folder: Infrastructure
    interval: 1m
    rules:
      # --- ALERT 1: HIGH CPU USAGE (> 80%) ---
      - uid: container_cpu_high
        title: "High CPU Usage: {{ $labels.name }}"
        condition: C
        for: 1m
        data:
          - refId: A
            datasourceUid: Prometheus # Matches name in datasource.yml
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: sum(rate(container_cpu_usage_seconds_total{name!=""}[1m])) by (name) * 100
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: -100 # Internal Grafana Expression
            model:
              conditions:
                - evaluator: { params: [80], type: gt } # > 80%
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              refId: B
              type: reduce
          - refId: C
            datasourceUid: -100
            model:
              conditions:
                - evaluator: { params: [80], type: gt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              refId: C
              type: threshold

      # --- ALERT 2: HIGH MEMORY USAGE (> 1GB) ---
      - uid: container_memory_high
        title: "High Memory Usage: {{ $labels.name }}"
        condition: C
        for: 1m
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Filter for containers using more than 1GB (1073741824 bytes)
              expr: sum(container_memory_usage_bytes{name!=""}) by (name)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: -100
            model:
              conditions:
                - evaluator: { params: [1073741824], type: gt } # > 1GB
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              refId: B
              type: reduce
          - refId: C
            datasourceUid: -100
            model:
              conditions:
                - evaluator: { params: [1073741824], type: gt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              refId: C
              type: threshold

      # --- ALERT 3: ERROR LOGS DETECTED (Loki) ---
      - uid: app_error_logs
        title: "Error Logs Detected: {{ $labels.container }}"
        condition: C
        for: 0m # Alert immediately
        data:
          - refId: A
            datasourceUid: Loki # Matches name in datasource.yml
            relativeTimeRange: { from: 300, to: 0 }
            model:
              # Search for "error", "fatal", or "panic" in the last 5 minutes
              expr: sum by (container) (count_over_time({job="docker"} |~ "(?i)error|fatal|panic" [1m]))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: -100
            model:
              conditions:
                - evaluator: { params: [0], type: gt } # Count > 0
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              refId: B
              type: reduce
          - refId: C
            datasourceUid: -100
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              refId: C
              type: threshold
