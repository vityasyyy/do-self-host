apiVersion: 1

# 1. Contact Points (Discord)
contactPoints:
  - orgId: 1
    name: Discord-Channel
    receivers:
      - uid: discord-receiver
        type: discord
        settings:
          url: "${DISCORD_WEBHOOK_URL}"
          message: |
            {{ template "default.message" . }}

# 2. Notification Policies
policies:
  - orgId: 1
    name: Default-Policy
    receiver: Discord-Channel
    group_by: ["alertname", "container"]

groups:
  - orgId: 1
    name: Container-Lifecycle
    folder: Infrastructure
    interval: 30s
    rules:
      # === CONTAINER EXITED ===
      - uid: container_exited
        title: "Container Exited: {{ $labels.name }}"
        condition: C
        for: 1m
        data:
          - refId: A
            datasourceUid: Prometheus
            model:
              expr: container_last_seen{name!=""}
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              type: reduce
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions:
                - evaluator:
                    type: lt
                    params: [60]

      # === RESTART LOOP ===
      - uid: container_restart_loop
        title: "Container Restart Loop: {{ $labels.name }}"
        condition: C
        for: 1m
        data:
          - refId: A
            datasourceUid: Prometheus
            model:
              expr: changes(container_start_time_seconds{name!=""}[5m])
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              type: reduce
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [3]

      # === SERVICE DOWN ===
      - uid: service_down
        title: "Service Down: {{ $labels.instance }}"
        condition: C
        for: 1m
        data:
          - refId: A
            datasourceUid: Prometheus
            model:
              expr: up == 0
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

  - orgId: 1
    name: Backend-Logs
    folder: Applications
    interval: 1m
    rules:
      # === ERROR RATE SPIKE ===
      - uid: backend_error_spike
        title: "Backend Error Spike"
        condition: C
        for: 2m
        data:
          - refId: A
            datasourceUid: Loki
            model:
              expr: |
                sum(
                  count_over_time(
                    {container=~"*.*", level="error"}[1m]
                  )
                ) or vector(0)
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [10]

      # === PANIC / FATAL ===
      - uid: backend_panic
        title: "Backend Panic / Fatal"
        condition: C
        for: 0m
        data:
          - refId: A
            datasourceUid: Loki
            model:
              expr: |
                sum(
                  count_over_time(
                    {container=~"*.*"} |~ "(?i)panic|fatal"[1m]
                  )
                )
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # === ERROR CODE REGRESSION ===
      - uid: backend_auth_error_spike
        title: "Backend Internal Server Error Spike"
        condition: C
        for: 3m
        data:
          - refId: A
            datasourceUid: Loki
            model:
              expr: |
                sum(
                  count_over_time(
                    {container=~"*.*", status="500"}[1m]
                  )
                )
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [50]
