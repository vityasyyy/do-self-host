apiVersion: 1

# 1. Contact Points (Discord)
contactPoints:
  - orgId: 1
    name: Discord-Channel
    receivers:
      - uid: discord-receiver
        type: discord
        settings:
          url: "${DISCORD_WEBHOOK_URL}"
          message: |
            {{ template "default.message" . }}

# 2. Notification Policies
policies:
  - orgId: 1
    name: Default-Policy
    receiver: Discord-Channel
    group_by: ["alertname", "container"]

# 3. Alert Rules
groups:
  - orgId: 1
    name: Docker-Alerts
    folder: Infrastructure
    interval: 1m
    rules:
      # --- ALERT 1: HIGH CPU USAGE (> 80%) ---
      - uid: container_cpu_high
        title: "High CPU Usage: {{ $labels.name }}"
        condition: C
        for: 1m
        data:
          # Step A: Query Prometheus
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: sum(rate(container_cpu_usage_seconds_total{name!=""}[1m])) by (name) * 100
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A

          # Step B: Reduce to a single number (Last value)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              expression: A
              type: reduce
              reducer: last
              settings:
                mode: dropNN

          # Step C: Threshold Check (> 80)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              expression: B
              type: threshold
              conditions:
                - evaluator: { params: [80], type: gt }

      # --- ALERT 2: HIGH MEMORY USAGE (> 1GB) ---
      - uid: container_memory_high
        title: "High Memory Usage: {{ $labels.name }}"
        condition: C
        for: 1m
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: sum(container_memory_usage_bytes{name!=""}) by (name)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              expression: A
              type: reduce
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              expression: B
              type: threshold
              conditions:
                - evaluator: { params: [1073741824], type: gt }

      # --- ALERT 3: ERROR LOGS DETECTED (Loki) ---
      - uid: app_error_logs
        title: "Error Logs Detected: {{ $labels.container }}"
        condition: C
        for: 0m
        data:
          - refId: A
            datasourceUid: Loki
            relativeTimeRange: { from: 300, to: 0 }
            model:
              expr: sum by (container) (count_over_time({job="docker"} |~ "(?i)error|fatal|panic" [1m]))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              expression: A
              type: reduce
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              expression: B
              type: threshold
              conditions:
                - evaluator: { params: [0], type: gt }
      # --- ALERT 4: CONTAINER RESTARTING (CrashLoop / Failed Deployment) ---
      # Triggers if a container restarts more than 2 times in 5 minutes.
      - uid: container_restarts
        title: "Container Restart Loop: {{ $labels.name }}"
        condition: C
        for: 1m
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange: { from: 300, to: 0 } # Look back 5 minutes
            model:
              # 'changes' counts how many times the value changed.
              # If start_time changes, the container restarted.
              expr: changes(container_start_time_seconds{name!=""}[5m])
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              expression: A
              type: reduce
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              expression: B
              type: threshold
              conditions:
                # Alert if restarts > 2
                - evaluator: { params: [2], type: gt }

      # --- ALERT 5: CRITICAL SERVICE DOWN ---
      # Triggers if a target (like cAdvisor, Node Exporter, or your App) is unreachable
      - uid: service_down
        title: "Service Unreachable: {{ $labels.instance }}"
        condition: C
        for: 1m
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # 'up' is a built-in metric. 1 = UP, 0 = DOWN.
              expr: up
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              expression: A
              type: reduce
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              expression: B
              type: threshold
              conditions:
                # Alert if value is 0 (DOWN)
                - evaluator: { params: [0], type: eq }
