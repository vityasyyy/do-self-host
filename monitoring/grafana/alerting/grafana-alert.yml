apiVersion: 1

contactPoints:
  - orgId: 1
    name: Discord-Channel
    receivers:
      - uid: discord-receiver
        type: discord
        settings:
          url: "${DISCORD_WEBHOOK_URL}"
          message: |
            {{ template "default.message" . }}

policies:
  - orgId: 1
    name: Default-Policy
    receiver: Discord-Channel
    group_by: ["alertname", "container", "instance"]

groups:
  - orgId: 1
    name: Container-Lifecycle
    folder: Infrastructure
    interval: 1m
    rules:
      - uid: container_missing
        title: "Container Missing: {{ $labels.name }}"
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: absent(container_last_seen{name!=""})
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              conditions: [{ evaluator: { type: gt, params: [0] } }]

      - uid: container_restart_loop
        title: "Container Restart Loop: {{ $labels.name }}"
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: changes(container_start_time_seconds{name!=""}[10m])
          - refId: B # Reduce Step
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C # Threshold Step
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions: [{ evaluator: { type: gt, params: [3] } }]

      - uid: service_down
        title: "Service Down: {{ $labels.instance }}"
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              expr: up{job!=""}
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions: [{ evaluator: { type: lt, params: [1] } }] # Alert if < 1 (i.e. 0)

  - orgId: 1
    name: Backend-Logs
    folder: Applications
    interval: 1m
    rules:
      # --- PANIC ---
      - uid: backend_panic
        title: "Backend Panic: {{ $labels.container }}"
        condition: C # Must point to the Threshold expression
        for: 0m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            datasourceUid: Loki
            relativeTimeRange: { from: 300, to: 0 }
            model:
              expr: |
                sum by (container) (
                  count_over_time(
                    {container!~"monitoring-grafana", level=~"error|fatal"}
                    |~ "(?i)panic|fatal error"
                    [1m]
                  )
                )
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: sum # Sum up all counts in the window (or max)
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions: [{ evaluator: { type: gt, params: [0] } }]

      # --- ERROR SPIKE ---
      - uid: backend_error_spike
        title: "High Error Rate: {{ $labels.container }}"
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            datasourceUid: Loki
            relativeTimeRange: { from: 300, to: 0 }
            model:
              expr: |
                sum by (container) (
                  count_over_time({container=~".+"} |~ "(?i)error" !~ "query=" [1m])
                )
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: mean # Average errors per minute over the time range
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions: [{ evaluator: { type: gt, params: [10] } }]
