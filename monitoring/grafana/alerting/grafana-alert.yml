apiVersion: 1

groups:
  - orgId: 1
    name: "Production Alerts"
    folder: "General"
    interval: 1m
    rules:
      # ALERT 1: High CPU (Prometheus)
      - uid: high_cpu_alert
        title: "High CPU Usage"
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus # Must match your datasource.yml UID
            model:
              expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        for: 5m
        annotations:
          summary: "Instance {{ $labels.instance }} has high CPU"
        labels:
          severity: warning

      # ALERT 2: Error Logs Spike (Loki)
      - uid: error_log_spike
        title: "High Error Rate"
        condition: A
        data:
          - refId: A
            datasourceUid: loki # Must match your datasource.yml UID
            model:
              # This counts lines containing "error" in the last 1 minute
              expr: count_over_time({job="docker"} |= "error" [1m]) > 10
              refId: A
        for: 2m
        annotations:
          summary: "Container {{ $labels.container }} is throwing errors"
        labels:
          severity: critical
