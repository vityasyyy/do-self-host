apiVersion: 1

contactPoints:
  - orgId: 1
    name: Discord-Channel
    receivers:
      - uid: discord-receiver
        type: discord
        settings:
          url: "${DISCORD_WEBHOOK_URL}"
          message: |
            {{ template "default.message" . }}

policies:
  - orgId: 1
    name: Default-Policy
    receiver: Discord-Channel
    group_by: ["alertname", "container"]

groups:
  # ===============================
  # CONTAINER LIFECYCLE
  # ===============================
  - orgId: 1
    name: Container-Lifecycle
    folder: Infrastructure
    interval: 30s
    rules:
      # --- CONTAINER EXITED (REAL EXIT ONLY) ---
      - uid: container_exited
        title: "Container Exited: {{ $labels.name }}"
        condition: C
        for: 1m
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: |
                time() - container_last_seen{name!=""} > 60
                and time() - container_start_time_seconds{name!=""} > 300
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # --- RESTART LOOP ---
      - uid: container_restart_loop
        title: "Container Restart Loop: {{ $labels.name }}"
        condition: C
        for: 1m
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: |
                sum by (name) (
                  changes(container_start_time_seconds{name!=""}[5m])
                )
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              type: reduce
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [3]

      # --- SERVICE DOWN ---
      - uid: service_down
        title: "Service Down: {{ $labels.instance }}"
        condition: C
        for: 1m
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 120
              to: 0
            model:
              expr: up == 0
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

  # ===============================
  # BACKEND LOG ALERTS
  # ===============================
  - orgId: 1
    name: Backend-Logs
    folder: Applications
    interval: 1m
    rules:
      # --- ERROR SPIKE ---
      - uid: backend_error_spike
        title: "Backend Error Spike"
        condition: C
        for: 2m
        data:
          - refId: A
            datasourceUid: Loki
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: |
                sum(
                  count_over_time(
                    {container=~".+"} |~ "(?i)error"[1m]
                  )
                )
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [10]

      - uid: backend_panic
        title: "Backend Panic / Fatal"
        condition: C
        for: 0m
        data:
          - refId: A
            datasourceUid: Loki
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: |
                sum(
                  count_over_time(
                    {container=~".+"} |~ "(?i)panic|fatal"[1m]
                  )
                )
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              type: reduce
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        # === ERROR CODE REGRESSION ===
      - uid: backend_error_spike
        title: "Backend Error Spike"
        condition: C
        for: 2m
        data:
          - refId: A
            datasourceUid: Loki
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: |
                sum(
                  count_over_time(
                    {container=~".+"} |~ "(?i)error"[1m]
                  )
                )
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              type: reduce
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [10]
