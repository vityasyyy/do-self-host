# --- SWAP SETUP ---
- name: Check if swap file exists
  ansible.builtin.stat:             # <--- Fixed
    path: /swapfile
  register: common_swap_file        # <--- Renamed variable

- name: Create swap file
  ansible.builtin.command:          # <--- Fixed
    cmd: dd if=/dev/zero of=/swapfile bs=1M count=2048
  args:
    creates: /swapfile
  when: not common_swap_file.stat.exists  # <--- Updated variable reference

- name: Set permissions on swap file
  ansible.builtin.file:             # <--- Fixed
    path: /swapfile
    owner: root
    group: root
    mode: '0600'
  when: not common_swap_file.stat.exists  # <--- Updated variable reference

- name: Format swap file
  ansible.builtin.command:          # <--- Fixed
    cmd: mkswap /swapfile
  changed_when: true
  when: not common_swap_file.stat.exists  # <--- Updated variable reference

- name: Enable swap file
  ansible.builtin.command:          # <--- Fixed
    cmd: swapon /swapfile
  changed_when: true
  when: not common_swap_file.stat.exists  # <--- Updated variable reference

- name: Add swap to fstab
  ansible.builtin.lineinfile:       # <--- Fixed
    path: /etc/fstab
    line: '/swapfile none swap sw 0 0'
    state: present

# --- SYSTEM BASICS ---
- name: Update apt cache
  ansible.builtin.apt:              # <--- Fixed
    update_cache: true
    cache_valid_time: 3600

- name: Install basics
  ansible.builtin.apt:              # <--- Fixed
    name: ['curl', 'git', 'ufw', 'fail2ban', 'unattended-upgrades']
    state: present

# --- FIREWALL ---
- name: Allow SSH
  community.general.ufw:            # <--- Fixed (Requires community.general collection)
    rule: allow
    name: OpenSSH

- name: Configure UFW (Firewall)
  community.general.ufw:            # <--- Fixed
    state: enabled
    policy: deny

# --- SSH HARDENING ---
- name: Secure SSH (Disable Root Login)
  ansible.builtin.lineinfile:       # <--- Fixed
    path: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin'
    line: 'PermitRootLogin prohibit-password'
  notify: Restart SSH
