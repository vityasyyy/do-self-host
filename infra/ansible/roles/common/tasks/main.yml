# --- SWAP SETUP ---
- name: Check if swap file exists
  stat:
    path: /swapfile
  register: swap_file

- name: Create swap file
  command: dd if=/dev/zero of=/swapfile bs=1M count=2048
  args:
    creates: /swapfile  # <--- Fix: Tells Ansible "Skip if this file exists"
  when: not swap_file.stat.exists

- name: Set permissions on swap file
  file:
    path: /swapfile
    owner: root
    group: root
    mode: '0600'
  when: not swap_file.stat.exists

- name: Format swap file
  command: mkswap /swapfile
  changed_when: true    # <--- Fix: Tells Ansible "If this runs, it counts as a change"
  when: not swap_file.stat.exists

- name: Enable swap file
  command: swapon /swapfile
  changed_when: true    # <--- Fix: Tells Ansible "If this runs, it counts as a change"
  when: not swap_file.stat.exists

- name: Add swap to fstab
  lineinfile:
    path: /etc/fstab
    line: '/swapfile none swap sw 0 0'
    state: present
# --- SYSTEM BASICS ---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install basics
  apt:
    name: ['curl', 'git', 'ufw', 'fail2ban', 'unattended-upgrades']
    state: present

# --- FIREWALL (ORDER MATTERS!) ---
- name: Allow SSH
  ufw:
    rule: allow
    name: OpenSSH

- name: Configure UFW (Firewall)
  ufw:
    state: enabled
    policy: deny

# --- SSH HARDENING ---
- name: Secure SSH (Disable Root Login)
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin'
    # 'prohibit-password' is SAFER than 'no' if you are using keys to login as root
    line: 'PermitRootLogin prohibit-password'
  notify: Restart SSH
