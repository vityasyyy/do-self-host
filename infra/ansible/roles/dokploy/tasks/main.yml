- name: Check if Dokploy is already running
  command: docker ps -q -f name=dokploy
  register: dokploy_container
  changed_when: false
  failed_when: false

- name: Create Dokploy Directory
  file:
    path: /etc/dokploy
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Install Dokploy Platform
  shell: |
    set -euo pipefail && curl -sSL https://dokploy.com/install.sh | sh
  args:
    creates: /etc/dokploy/docker-compose.yml
    executable: /bin/bash
  # Only run if the config file is missing AND the container is not running
  when: dokploy_container.stdout | length == 0


- name: Configure Traefik
  copy:
    src: traefik.yml
    dest: /etc/dokploy/traefik/traefik.yml
    owner: root
    group: root
    mode: '0644'
  notify: Restart Traefik
