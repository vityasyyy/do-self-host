- name: Create Dokploy Directory
  file:
    path: /etc/dokploy
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Install Dokploy Platform
  shell: |
    set -euo pipefail && curl -sSL https://dokploy.com/install.sh | sh
  args:
    creates: /etc/dokploy/docker-compose.yml
    executable: /bin/bash
