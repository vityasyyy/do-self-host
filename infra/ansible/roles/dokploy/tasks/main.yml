- name: Check if Dokploy is already running
  ansible.builtin.command:          # <--- Fixed
    cmd: docker ps -q -f name=dokploy
  register: dokploy_container
  changed_when: false
  failed_when: false

- name: Create Dokploy Directory
  ansible.builtin.file:             # <--- Fixed
    path: /etc/dokploy
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Install Dokploy Platform
  ansible.builtin.shell: |          # <--- Fixed
    set -euo pipefail && curl -sSL https://dokploy.com/install.sh | sh
  args:
    creates: /etc/dokploy/docker-compose.yml
    executable: /bin/bash
  when: dokploy_container.stdout | length == 0

- name: Configure Traefik
  ansible.builtin.copy:             # <--- Fixed
    src: traefik.yml
    dest: /etc/dokploy/traefik/traefik.yml
    owner: root
    group: root
    mode: '0644'
  notify: Restart Traefik
