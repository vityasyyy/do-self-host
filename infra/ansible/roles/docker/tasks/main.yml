- name: Install Docker dependencies
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Download Docker GPG key (ASCII)
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /tmp/docker.gpg.asc
    mode: '0644'
    force: true

- name: Dearmor Docker GPG key
  command: gpg --dearmor -o /usr/share/keyrings/docker.gpg /tmp/docker.gpg.asc
  args:
    creates: /usr/share/keyrings/docker.gpg

- name: Add Docker repository
  apt_repository:
    repo: >
      deb [arch=amd64 signed-by=/usr/share/keyrings/docker.gpg]
      https://download.docker.com/linux/ubuntu
      {{ ansible_lsb.codename }} stable
    state: present

- name: Install Docker Engine
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: true

- name: Configure Docker daemon
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "storage-driver": "overlay2",
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "100m",
          "max-file": "3"
        }
      }
    owner: root
    group: root
    mode: "0644"

- name: Start Docker
  systemd:
    name: docker
    state: started
    enabled: true

- name: Fail if Docker storage driver is not overlay2
  command: docker info --format '{{"{{"}} .Driver {{"}}"}}'
  register: docker_driver
  changed_when: false
  failed_when: docker_driver.stdout != "overlay2"
