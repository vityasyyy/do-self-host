- name: Remove old/conflicting Docker repository definition
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Install Docker dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Download Docker GPG key (ASCII)
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /tmp/docker.gpg.asc
    mode: '0644'
    force: true

- name: Dearmor Docker GPG key
  ansible.builtin.command: gpg --dearmor -o /usr/share/keyrings/docker.gpg /tmp/docker.gpg.asc
  args:
    creates: /usr/share/keyrings/docker.gpg

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: >
      deb [arch=amd64 signed-by=/usr/share/keyrings/docker.gpg]
      https://download.docker.com/linux/ubuntu
      {{ ansible_lsb.codename }} stable
    state: present

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: true

- name: Configure Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "storage-driver": "overlay2",
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "100m",
          "max-file": "3"
        }
      }
    owner: root
    group: root
    mode: "0644"

- name: Start Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Fail if Docker storage driver is not overlay2
  ansible.builtin.command: docker info --format '{{ "{{" }} .Driver {{ "}}" }}'
  register: docker_driver
  changed_when: false
  failed_when: docker_driver.stdout != "overlay2"
