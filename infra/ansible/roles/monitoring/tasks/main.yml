- name: Create Monitoring Directory
  file:
    path: /opt/monitoring
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Copy Compose File
  copy:
    dest: /opt/monitoring/docker-compose.yml
    mode: '0644'
    content: |
      services:
        node_exporter:
          image: prom/node-exporter
          volumes: ['/proc:/host/proc:ro', '/sys:/host/sys:ro', '/:/rootfs:ro']
          command: ['--path.procfs=/host/proc', '--path.rootfs=/rootfs']
        cadvisor:
          image: gcr.io/cadvisor/cadvisor
          volumes: ['/:/rootfs:ro', '/var/run:/var/run:ro', '/sys:/sys:ro', '/var/lib/docker/:/var/lib/docker:ro']
        prometheus:
          image: prom/prometheus
          volumes: ['./prometheus.yml:/etc/prometheus/prometheus.yml']
        grafana:
          image: grafana/grafana
          environment: [GF_SECURITY_ADMIN_PASSWORD={{ grafana_password }}] # Change this immediately!

- name: Copy Prometheus Config
  copy:
    dest: /opt/monitoring/prometheus.yml
    mode: '0644'
    content: |
      global: { scrape_interval: 15s }
      scrape_configs:
        - job_name: 'node'
          static_configs: [{ targets: ['node_exporter:9100'] }]
        - job_name: 'cadvisor'
          static_configs: [{ targets: ['cadvisor:8080'] }]

- name: Start Monitoring Stack
  command: docker compose up -d
  args:
    chdir: /opt/monitoring
  register: compose_output
  changed_when: "'Created' in compose_output.stdout or 'Recreated' in compose_output.stdout"
