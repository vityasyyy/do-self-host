- name: Download Cloudflared
  ansible.builtin.get_url:          # <--- Fixed
    url: https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
    dest: /usr/local/bin/cloudflared
    mode: '0755'

- name: Create Cloudflared Service File
  ansible.builtin.copy:             # <--- Fixed
    dest: /etc/systemd/system/cloudflared.service
    mode: '0644'
    content: |
      [Unit]
      Description=cloudflared
      After=network.target

      [Service]
      TimeoutStartSec=0
      Type=notify
      ExecStart=/usr/local/bin/cloudflared tunnel run --token {{ tunnel_token }}
      Restart=on-failure
      RestartSec=5s

      [Install]
      WantedBy=multi-user.target

- name: Reload Systemd Daemon
  ansible.builtin.systemd:          # <--- Fixed
    daemon_reload: true

- name: Start Tunnel Service
  ansible.builtin.service:          # <--- Fixed
    name: cloudflared
    state: restarted
    enabled: true
