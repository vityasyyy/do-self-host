name: Production CI/CD Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - "infra/**"
  pull_request:
    branches: ["main"]
    paths:
      - "infra/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  infra-cicd:
    name: Infrastructure Lifecycle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
      TF_VAR_domain: ${{ secrets.DOMAIN }}
      TF_VAR_maintenance_mode: ${{ secrets.MAINTENANCE_MODE }}
      TF_VAR_ssh_pub_path: "../ansible/ssh_key.pub"
      ANSIBLE_HOST_KEY_CHECKING: "False"
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Setup Ansible
        run: |
          pip install ansible ansible-lint
          ansible-galaxy collection install community.docker community.general || true

      - name: Setup Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Configure SSH Keys
        run: |
          mkdir -p ~/.ssh/
          # 1. Create the Master Private Key (from Secrets)
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/github_actions_key
          chmod 600 ~/.ssh/github_actions_key

          # 2. Create the Public Key (For Terraform to upload to DigitalOcean)
          # We place it in 'infra/ansible' so Terraform can find it via '../ansible/ssh_key.pub'
          ssh-keygen -y -f ~/.ssh/github_actions_key > ./ansible/ssh_key.pub

          # 3. Create the Private Key Copy (For Ansible connection)
          # Terraform writes the inventory pointing to this location
          cp ~/.ssh/github_actions_key ./ansible/ssh_key
          chmod 600 ./ansible/ssh_key

          # 4. Configure SSH to use Cloudflare Access proxy for tunnel connections
          echo "Host ssh.${{ secrets.DOMAIN }}" > ~/.ssh/config
          echo "  ProxyCommand cloudflared access ssh --hostname %h --service-token-id ${CF_ACCESS_CLIENT_ID} --service-token-secret ${CF_ACCESS_CLIENT_SECRET}" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Terraform Init
        working-directory: ./infra/terraform
        run: terraform init -upgrade

      - name: Terraform Format Check
        working-directory: ./infra/terraform
        run: terraform fmt -check

      - name: Terraform Plan
        working-directory: ./infra/terraform
        id: plan
        run: terraform plan -no-color
        continue-on-error: true

      - name: Terraform Apply (Runs on Push)
        working-directory: ./infra/terraform
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false

      - name: Ansible Lint
        working-directory: ./infra/ansible
        run: |
          # Create Fake Inventory for Syntax Check
          echo "[dokploy_servers]" > dummy_inventory.ini
          echo "localhost" >> dummy_inventory.ini

          # Syntax Check
          ansible-playbook -i dummy_inventory.ini playbook.yml --syntax-check

          # Lint Check
          ansible-lint playbook.yml

      - name: Ansible Apply (Runs on Push)
        working-directory: ./infra/ansible
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          export ANSIBLE_SSH_ARGS="-F $HOME/.ssh/config"
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass

          ansible-playbook -i inventory.ini \
            --vault-password-file .vault_pass \
            playbook.yml

          rm .vault_pass
