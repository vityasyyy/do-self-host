name: Production CI/CD Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - "infra/**"
  pull_request:
    branches: ["main"]
    paths:
      - "infra/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  infra-cicd:
    name: Infrastructure Lifecycle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.TF_VAR_cloudflare_account_id }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.TF_VAR_cloudflare_zone_id }}
      TF_VAR_admin_email: ${{ secrets.TF_VAR_admin_email }}
      TF_VAR_domain: ${{ secrets.DOMAIN }}
      TF_VAR_ssh_pub_path: "../ansible/ssh_key.pub"
      ANSIBLE_HOST_KEY_CHECKING: "False"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Setup Ansible
        run: |
          pip install ansible ansible-lint
          ansible-galaxy collection install community.docker || true

      - name: Configure SSH Keys
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keygen -y -f ~/.ssh/id_ed25519 > ./ansible/ssh_key.pub

          echo "Host *" > ~/.ssh/config
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Terraform Init
        working-directory: ./infra/terraform
        run: terraform init -upgrade

      - name: Terraform Format Check
        working-directory: ./infra/terraform
        run: terraform fmt -check

      - name: Terraform Plan
        working-directory: ./infra/terraform
        id: plan
        run: terraform plan -no-color
        continue-on-error: true

      - name: Terraform Apply (Runs on Push)
        working-directory: ./infra/terraform
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false

      - name: Ansible Lint
        working-directory: ./infra/ansible
        run: |
          # Create Fake Inventory for Syntax Check
          echo "[dokploy_servers]" > dummy_inventory.ini
          echo "localhost" >> dummy_inventory.ini

          # Syntax Check
          ansible-playbook -i dummy_inventory.ini playbook.yml --syntax-check

          # Lint Check
          ansible-lint playbook.yml

      - name: Ansible Apply (Runs on Push)
        working-directory: ./infra/ansible
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass

          ansible-playbook -i inventory.ini \
            --vault-password-file .vault_pass \
            playbook.yml

          rm .vault_pass
